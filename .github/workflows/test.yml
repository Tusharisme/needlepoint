name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.9"}     # what /usr/bin/python3 is on macOS (Xcode CLT)
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: unit + platform tests (sqlite backend)
        run: python -m unittest discover -s tests -v
        env: {NDL_DEBUG: "1", PYTHONIOENCODING: "utf-8"}
      - name: unit + platform tests (json backend)
        run: python -m unittest discover -s tests
        env: {NDL_DEBUG: "1", NDL_NO_SQLITE: "1", PYTHONIOENCODING: "utf-8"}
      - name: macOS spawn-mode indexing
        if: runner.os == 'macOS'
        run: NDL_MP_START=spawn python plugins/needlepoint/skills/needlepoint/scripts/ndl.py bench --root "$(python -c 'import sysconfig;print(sysconfig.get_paths()["stdlib"])')" -n 50
        shell: bash
